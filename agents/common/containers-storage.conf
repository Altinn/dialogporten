# The agent's root filesystem is overlayfs, which the kernel overlay driver cannot stack on: without a mount program,
# Podman fails to start with "'overlay' is not supported over overlayfs".
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
