apiVersion: agents.platform/v1alpha1
kind: AgentVariant
extends: agent.yaml

metadata:
  name: dialogporten-backend-worktree

# Mounts your own checkout instead of the clone the agent makes at boot.
spec:
  sandbox:
    mounts:
      - type: bind
        source: ../..
        target: /home/agent/code/dialogporten
        readOnly: false
