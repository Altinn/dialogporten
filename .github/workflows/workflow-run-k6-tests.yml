name: Run K6 tests

on:
  workflow_call:
    inputs:
      apiVersion:
        required: true
        type: string
      environment:
        required: true
        type: string
      testSuitePath:
        required: true
        type: string
      ref:
        description: "The branch or tag ref to run the tests on. Using default checkout ref if not provided."
        required: false
        default: ${{ github.ref }}
        type: string
    secrets:
      TOKEN_GENERATOR_USERNAME:
        required: true
      TOKEN_GENERATOR_PASSWORD:
        required: true

jobs:
  k6-test:
    runs-on: ubuntu-latest
    # The suites take a minute or two in at23 and staging and about 11 minutes in yt01. The
    # limit keeps a stuck run from holding the at23 queue for hours.
    timeout-minutes: 30
    permissions:
      checks: write
      pull-requests: write

    steps:
    - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - name: Checkout code
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}

    # todo: change to use the new https://github.com/grafana/setup-k6-action and https://github.com/grafana/run-k6-action
    # grafana/k6-action is deprecated
    - name: Run K6 tests (${{ inputs.testSuitePath }})
      uses: grafana/k6-action@e4714b734f2b0afaabeb7b4a69142745548ab9ec # v0.3.1
      with:
        filename: ${{ inputs.testSuitePath }}
        flags: --quiet --log-output=stdout --include-system-env-vars
      env:
        API_ENVIRONMENT: ${{ inputs.environment }}
        API_VERSION: ${{ inputs.apiVersion }}
        TOKEN_GENERATOR_USERNAME: ${{ secrets.TOKEN_GENERATOR_USERNAME }}
        TOKEN_GENERATOR_PASSWORD: ${{ secrets.TOKEN_GENERATOR_PASSWORD }}

    - name: Store test summary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: k6-summary-report
        path: junit.xml

    - name: 'Publish test results'
      uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
      if: always()
      with:
        action_fail: true
        # The tested commit. By default the results go on the event's commit, which for a
        # repository dispatch is the newest commit on main, not the release under test.
        commit: ${{ steps.checkout.outputs.commit }}
        files: |
          junit.xml
