name: Run K6 tests

on:
  workflow_dispatch:
    inputs:
      apiVersion:
        description: 'API Version'
        required: true
        default: 'v1'
      environment:
        description: 'Environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - staging
      testSuitePath:
        description: 'Path to test suite to run'
        required: true
        default: 'tests/k6/suites/all-single-pass.js'

# at23 (test) shares its queue with the E2E runs of ci-cd-flux-reconciliation-result.yml,
# because the K6 cleanup purges the test dialogs of every run.
concurrency:
  group: ${{ inputs.environment == 'test' && 'dialogporten-e2e-at23' || format('{0}-{1}', github.workflow, inputs.environment) }}
  queue: max

permissions:
  contents: read

jobs:
  k6-test:
    name: "Run K6 tests"
    uses: ./.github/workflows/workflow-run-k6-tests.yml
    secrets:
      TOKEN_GENERATOR_USERNAME: ${{ secrets.TOKEN_GENERATOR_USERNAME }}
      TOKEN_GENERATOR_PASSWORD: ${{ secrets.TOKEN_GENERATOR_PASSWORD }}
    with:
      environment: ${{ inputs.environment }}
      apiVersion: ${{ inputs.apiVersion }}
      testSuitePath: ${{ inputs.testSuitePath }}
    permissions:
      checks: write
      pull-requests: write
