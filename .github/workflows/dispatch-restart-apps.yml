name: Restart Container Apps

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to restart apps in"
        required: true
        type: choice
        options:
          - test
          - yt01
          - staging
          - prod
      app:
        description: "App to restart (all restarts every app)"
        required: false
        default: all
        type: choice
        options:
          - all
          - graphql
          - webapi-eu
          - webapi-so
          - service
  # Called by auto-restart-app.yml; workflow_call does not support choice inputs,
  # so these are strings and the restart script validates the app value.
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      app:
        required: false
        default: all
        type: string

run-name: Restart Container Apps in ${{ inputs.environment }} (${{ inputs.app || 'all' }})

jobs:
  restart-container-apps:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: "Checkout GitHub Action"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure Login
        uses: ./.github/actions/azure-login
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restart Container Apps
        shell: bash
        run: |
          set -euo pipefail

          # Explicit mapping: app names are not uniformly derivable ("service" has no -ca suffix).
          case "$APP_INPUT" in
            all)
              APPS=(
                "dp-be-${ENVIRONMENT}-webapi-so-ca"
                "dp-be-${ENVIRONMENT}-webapi-eu-ca"
                "dp-be-${ENVIRONMENT}-graphql-ca"
                "dp-be-${ENVIRONMENT}-service"
              )
              ;;
            webapi-so) APPS=("dp-be-${ENVIRONMENT}-webapi-so-ca") ;;
            webapi-eu) APPS=("dp-be-${ENVIRONMENT}-webapi-eu-ca") ;;
            graphql) APPS=("dp-be-${ENVIRONMENT}-graphql-ca") ;;
            service) APPS=("dp-be-${ENVIRONMENT}-service") ;;
            *)
              echo "❌ Unknown app: $APP_INPUT" >&2
              exit 1
              ;;
          esac

          az extension add --name containerapp --allow-preview --upgrade -y

          echo "Restarting apps in environment: $ENVIRONMENT"

          RESTARTED_COUNT=0
          for APP in "${APPS[@]}"; do
            echo "Finding latest revision for $APP..."
            REVISION=$(az containerapp revision list \
              --name "$APP" \
              --resource-group "$RESOURCE_GROUP" \
              --query "[?properties.active==\`true\`].name" \
              -o tsv | head -n 1)

            if [[ -n "$REVISION" ]]; then
              echo "✅ Found active revision for $APP: $REVISION"
              echo "Restarting revision $REVISION..."
              az containerapp revision restart \
                --name "$APP" \
                --resource-group "$RESOURCE_GROUP" \
                --revision "$REVISION"
              RESTARTED_COUNT=$((RESTARTED_COUNT + 1))
            else
              echo "⚠️ No active revision found for $APP"
            fi
          done

          # A caller asking for one specific app must not get a green run when nothing was
          # restarted; success here means a restart command actually executed. The all case
          # keeps its best-effort behavior.
          if [[ "$APP_INPUT" != "all" && "$RESTARTED_COUNT" -eq 0 ]]; then
            echo "❌ $APP_INPUT had no active revision; nothing was restarted" >&2
            exit 1
          fi
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP_NAME }}
          ENVIRONMENT: ${{ inputs.environment }}
          # No fallback here: GitHub applies the 'all' default when the input is omitted, so an
          # EMPTY value means a caller passed empty explicitly - that must fail the case statement
          # below rather than silently widen to every app.
          APP_INPUT: ${{ inputs.app }}

      - name: Logout from Azure
        if: ${{ failure() || success() }}
        run: az logout
