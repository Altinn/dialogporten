apiVersion: agents.platform/v1alpha1
kind: AgentVariant
extends: agent.yaml

metadata:
  name: dialogporten-backend-worktree

# Mounts the checkout this manifest is in, instead of the clone the agent makes at boot, so the agent works on
# your files.
spec:
  sandbox:
    mounts:
      - type: bind
        source: ../..
        target: /home/agent/code/dialogporten
        readOnly: false
