# Standalone nginx that simulates the APIM gateway used in production:
# it exposes the backend under an added /dialogporten prefix, stripping
# the prefix again before forwarding the request upstream unchanged.
events {}

http {
    upstream backend {
        server host.docker.internal:5123;
    }

    server {
        listen 8080;

        location /dialogporten/ {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /dialogporten;
        }
    }

    # HTTPS listener using the exported ASP.NET Core dev cert (run
    # export-dev-cert.sh first). Terminates TLS here and forwards to the
    # backend over plain HTTP, same as APIM does in production.
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/dev-cert.pem;
        ssl_certificate_key /etc/nginx/certs/dev-cert.key;

        location /dialogporten/ {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /dialogporten;
        }
    }

    # HTTPS listener, same as above, except without the proxy headers.
    server {
        listen 8444 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/dev-cert.pem;
        ssl_certificate_key /etc/nginx/certs/dev-cert.key;

        location /dialogporten/ {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
        }
    }
}
